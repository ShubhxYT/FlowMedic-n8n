services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/flowmedic.db
    volumes:
      - flowmedic-data:/data
    restart: "no"

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/flowmedic.db
    volumes:
      - flowmedic-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  flowmedic-data:
