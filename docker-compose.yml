services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/flowmedic.db
    volumes:
      - flowmedic-data:/data
    restart: unless-stopped
  dashboard:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      FLOWMEDIC_API_KEY: ${FLOWMEDIC_API_KEY:-}
      TRUST_PROXY_IP: ${TRUST_PROXY_IP:-false}
    depends_on:
      - api
    restart: unless-stopped
volumes:
  flowmedic-data:
